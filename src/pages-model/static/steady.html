<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hospital flow model</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0f17}
body{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#reel{display:block;height:min(calc(100vh - var(--chrome)),calc(var(--w)*1.7778));height:min(calc(100svh - var(--chrome)),calc(var(--w)*1.7778));width:min(var(--w),calc((100vh - var(--chrome))*.5625));width:min(var(--w),calc((100svh - var(--chrome))*.5625))}
#reel.land{height:min(calc(100vh - var(--chrome)),calc(var(--w)*.5625));height:min(calc(100svh - var(--chrome)),calc(var(--w)*.5625));width:min(var(--w),calc((100vh - var(--chrome))*1.7778));width:min(var(--w),calc((100svh - var(--chrome))*1.7778))}
#mode{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:6px min(8px,1.5vw);max-width:var(--w);font:min(12px,3.2vw)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:min(1.5px,.25vw)}
#mode button,#drawer .p button{background:none;border:1px solid var(--line);color:var(--label);padding:8px min(14px,2vw);border-radius:999px;font:inherit;letter-spacing:inherit;cursor:pointer}
#mode .g{display:flex;align-items:center;gap:min(6px,1.2vw);padding:4px;border:1px solid var(--line);border-radius:999px}
#mode button.on{color:var(--patient);border-color:var(--patient)}
#mode button:focus-visible{outline:1px solid var(--patient);outline-offset:2px}
#mode #reset,#mode #gear{padding:6px min(11px,2vw);font-size:1.3em;line-height:1;color:var(--patient);border-color:var(--patient)}
#mode button[hidden],#drawer[hidden]{display:none}
#mode #mbtn{color:var(--label)}#mode #mbtn.on{color:var(--metrias);border-color:var(--metrias)}
#drawer{position:fixed;z-index:2;top:0;right:0;bottom:0;width:340px;box-sizing:border-box;overflow-y:auto;padding:12px 16px 18px;border-left:1px solid var(--line);color:var(--label);font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;cursor:default;accent-color:var(--patient)}
@media (max-width:899px){#drawer{top:auto;left:0;width:auto;max-height:55vh;border:0;border-top:1px solid var(--line)}}
#drawer>*{width:100%;max-width:308px;margin-left:auto;margin-right:auto;box-sizing:border-box}
#drawer h4{margin:14px 0 4px;font:inherit;font-size:10px;letter-spacing:2px;text-align:center}
#drawer .r{display:grid;grid-template-columns:86px minmax(0,1fr) 86px;gap:10px;align-items:center;min-height:26px}
#drawer .r span{text-align:right;white-space:nowrap;font-size:11px}
#drawer b{font-weight:400;color:var(--patient);text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
#drawer input{width:100%;min-width:0;margin:0;cursor:pointer}
#drawer .n{font-size:10px;text-align:center}
#ro{display:grid;grid-template-columns:auto auto auto auto;justify-content:center;gap:3px 12px;white-space:nowrap}
#ro span{text-align:right}
#drawer .p{display:flex;justify-content:center;gap:8px;margin-top:14px;letter-spacing:1.5px}
#reel text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
#txt{margin:10px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--label);font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;text-align:center;-webkit-user-select:text;user-select:text;cursor:text}
#txt[hidden]{display:none}
:root{--chrome:118px;--w:100vw}
@media (min-width:900px){.dr{--w:calc(100vw - 340px)}.dr body{box-sizing:border-box;padding-right:340px}}
#dash{display:grid;grid-template-columns:repeat(6,auto);gap:4px 22px;align-items:start;box-sizing:border-box;max-width:var(--w);padding:0 16px;color:var(--label);font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:1.2px;cursor:default}
#dash .t{display:flex;flex-direction:column;gap:3px;min-width:0}
#dash b{font-weight:400;font-size:17px;letter-spacing:0;color:var(--patient);font-variant-numeric:tabular-nums;white-space:nowrap}
#dash i{font-style:normal;font-size:9px;letter-spacing:.6px;opacity:.8;white-space:nowrap}
#dash u{text-decoration:none}#dash .o{color:var(--bed)}#dash .w{color:var(--wait)}#dash .r{color:var(--stretcher)}
#dash #d_mt{display:none}.mt #dash #d_mt{display:flex}.mt #dash{grid-template-columns:repeat(7,auto)}#dash .m b,#dash .m span{color:var(--metrias)}
#drawer .tg{min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--label);font:inherit;font-size:10px;letter-spacing:.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer .tg.on{color:var(--metrias);border-color:var(--metrias)}#drawer .tg.on+b{color:var(--metrias)}
#pop{position:fixed;z-index:4;top:0;left:0;bottom:0;width:var(--w);box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:16px;background:#0a0f1799;cursor:default}
#pop[hidden]{display:none}
#card{position:relative;box-sizing:border-box;width:min(100%,460px);max-height:100%;overflow-y:auto;padding:16px 18px 18px;border:1px solid var(--line);border-radius:12px;background:#0a0f17;color:var(--label);font:10px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:1.2px}
#pt{margin:0 28px 6px 0;font:inherit;font-size:13px;letter-spacing:2px;color:var(--wait)}#pt.n{color:var(--label)}
#ps{margin:0 0 14px;font-size:12px;line-height:1.45;letter-spacing:0}
#pg{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start}#pg.c{grid-template-columns:1fr auto auto}
#pg i{display:block;margin-top:2px;font-style:normal;font-size:9px;letter-spacing:.6px;opacity:.8}
#pg b{display:block;font-weight:400;font-size:16px;letter-spacing:0;color:var(--patient);font-variant-numeric:tabular-nums;white-space:nowrap}
#pg div,#pg u{text-align:right;text-decoration:none}
#pop .m,#pop .m b{color:var(--metrias)}
#px{position:absolute;top:8px;right:10px;padding:4px 6px;background:none;border:0;color:var(--label);font:18px/1 ui-monospace,Menlo,monospace;cursor:pointer}
#pb{display:block;width:100%;margin-top:16px;padding:10px 12px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--label);font:inherit;font-size:11px;line-height:1.35;letter-spacing:1px;cursor:pointer}#pb.m{border-color:var(--metrias)}
@media (max-width:760px){#dash,.mt #dash{grid-template-columns:repeat(3,auto);gap:8px 18px}#dash b{font-size:15px}#pg b{font-size:14px}#pt{letter-spacing:1px}}
</style>
</head>
<body>
<div id="mode" role="group" aria-label="Mode"><span class="g"><button type="button" data-mode="walkthrough">WALKTHROUGH</button><button type="button" data-mode="steady">STEADY STATE</button></span><span class="g"><button type="button" data-mode="custom">CUSTOM</button><button type="button" id="reset" aria-label="Reset" title="Reset" hidden>&#8635;</button><button type="button" id="gear" aria-label="Controls" title="Controls" aria-expanded="false" hidden>&#9881;&#xFE0E;</button><button type="button" id="mbtn" aria-pressed="false" hidden>+ METRIAS</button></span></div>
<div id="drawer" hidden><div id="ro"></div><div id="kn"></div><div class="p"><button type="button" id="def">DEFAULTS</button><button type="button" id="link">COPY SETTINGS</button></div><pre id="txt" hidden></pre></div>
<svg id="reel" viewBox="0 0 1080 1920" role="img" aria-label="A hospital at steady state: patients flow from pre-hospital through the ED, beds, inpatient and discharge to post-acute while beds cycle through environmental services">
<g id="gs"></g><g id="gb"></g><g id="gp"></g>
<g id="play" visibility="hidden"><circle cx="540" cy="960" r="58" stroke-width="2"/><path d="M522 930L566 960L522 990Z"/></g>
</svg>
<div id="dash" aria-label="Dashboard">
<div class="t"><span>TIME</span><b id="d_t">0 s</b></div>
<div class="t"><span>PATIENTS SEEN</span><b id="d_seen">0</b><i id="d_split">0 admitted &middot; 0 home</i></div>
<div class="t"><span>DISCHARGES</span><b id="d_out">0</b></div>
<div class="t"><span>BEDS</span><b><u class="o" id="d_occ">0</u> &middot; <u class="w" id="d_tied">0</u> &middot; <u class="r" id="d_ready">0</u></b><i>occupied &middot; tied up &middot; ready</i></div>
<div class="t"><span>BOARDING TIME</span><b id="d_board">0 s</b></div>
<div class="t"><span>BED TIME LOST AT DISCHARGE</span><b id="d_lost">0 s</b></div>
<div class="t m" id="d_mt"><span>TIME SAVED</span><b id="d_saved">0 s</b><i>+ Metrias, at discharge</i></div>
</div>
<div id="pop" hidden><div id="card" role="dialog" aria-modal="true" aria-labelledby="pt"><button type="button" id="px" aria-label="Close">&times;</button><h4 id="pt"></h4><p id="ps"></p><div id="pg"></div><button type="button" id="pb"></button></div></div>
<script>
'use strict';
// ============================== CONFIG (edit by hand) ==============================
// Steady-state arithmetic at these defaults:
//   arrivals 1/3 per s; admits 0.4 x 1/3 = 0.133 per s.
//   ED: 6 stretchers, ~5.6 s each (dwell + walk) -> ~1.9 in use, utilisation ~0.31.
//   Bed cycle: close 0.5 + travel ~0.7 + LOS 5-15 + ~0.6 + discharge ~3.6 (3 hold + 0.6 slide, then both leave at once) + ~0.7 + EVS 0.4 + open 0.3 + ~0.7 ~= 12-22 s
//     -> 0.133 x 40 ~= 5.4 of 9 beds busy, utilisation ~0.60 (about 3-4 clean U's waiting in BEDS on average).
//   DISCHARGE: 2 separations x ~4.4 s -> utilisation ~0.29.  EVS: 2 slots x ~3.5 s -> ~0.23.  Nothing backs up.
// CUSTOM (CONFIG.custom): admits 0.5 / 1.2 = 0.42 per s, but DISCHARGE separates 2 per ~15 s = 0.13 per s:
//   squares pile up inside DISCHARGE, beds stop coming back, admit holds wait on their stretchers (amber), and
//   arrivals queue on the way in. LOS is the same in every mode.
const CONFIG = {
  seed: 20260927,          // RNG seed: same seed, same film
  orientation: 'auto',     // 'auto' | 'portrait' | 'landscape' (auto: aspect >= 1.2 lays the diagram out left to right in 1920 x 1080)
  mode: 'walkthrough',     // start mode: 'walkthrough' (one patient and one bed, repeating), 'steady' (the running hospital) or 'custom' (DISCHARGE as the bottleneck; plays once, then freezes); the selector above the reel switches it
  walkthroughPause: 1.2,   // s the picture rests between walkthrough repeats
  steadyWarmup: 45,        // s of simulated time run silently before STEADY STATE is shown, so it starts already populated
  speed: 900,              // ONE travel speed for every movement, viewBox px per second (~0.5-0.8 s per leg; was 300)
  stepHz: 60,              // fixed simulation steps per second
  maxFrameDt: 0.1,         // cap on real time per frame, s (tab switches never jump the film)
  stretchers: 6,           // ED stretchers (rows of 3; layout drawn for 6)
  beds: 9,                 // beds = BEDS grid positions = INPATIENT slots (rows of 3; layout drawn for 9)
  dischargeSlots: 2,       // squares DISCHARGE separates at once; the rest wait in its 3 x 3 grid, dot inside
  evsSlots: 2,             // beds EVS can clean at once
  holdShowAfter: 0.4,      // s an admit hold must have waited before its stretcher turns amber (avoids a flicker when beds are free)
  entryQueue: 10,          // arrivals that can wait on the way in when every stretcher is taken (runs back past PRE-HOSPITAL)
  arrivalEvery: 3,         // s between arrivals at PRE-HOSPITAL
  arrivalJitter: 0.2,      // +/- fraction on each arrival gap
  edDwell: 5,              // s a patient lies on a stretcher
  edJitter: 0.2,           // +/- fraction on ED dwell
  admitProb: 0.4,          // share admitted (admit hold); the rest go home via the outer loop
  los: 10,                 // s length of stay in INPATIENT, centre of the range
  losJitter: 0.5,          // +/- fraction: 0.5 gives a uniform random stay of 5 to 15 s
  close: 0.5,              // s for a clean U to close around an admitted dot
  discharge: 3,            // s the full square rests in DISCHARGE with the dot still inside: the rate-limiting delay
  separateSlide: 0.6,      // s the dot takes to slide out of the square (the visible separation)
  separateOffset: 44,      // viewBox px the dot slides along the flow, out of the square (was 60: that landed it inside the next grid cell)
  separateRest: 0,         // s dot and empty square rest side by side before they part (0: leave at once)
  separateGap: 0,          // s the empty square waits after the dot leaves, before heading to EVS (0: leave at once)
  evs: 0.4,                // s EVS spends on a dirty square before it opens (minimal)
  open: 0.3,               // s for the square to open back into a clean U
  intro: { start: 0.6, edDwell: 0.6, los: 1.0, discharge: 1.2, rest: 0, evs: 0.3 }, // s; one patient + one bed walk the full cycle alone (~16 s), then steady state
  stillAt: 75,             // s of simulated time shown as the still frame under prefers-reduced-motion
  custom: {           // CUSTOM mode: these override the values above while it runs (the ⚙ drawer edits them live)
    arrivalEvery: 0.8,     // s between arrivals
    admitProb: 0.35,       // share admitted
    los: 15,               // s length of stay in this mode, centre of the range (7.5 to 22.5 s with the jitter above)
    speed: 1100,           // travel speed in this mode, viewBox px per second
    edDwell: 3,            // s on a stretcher in this mode
    edJitter: 0.5,         // +/- fraction on that dwell (1.5 to 4.5 s)
    discharge: 4,          // s the full square holds in DISCHARGE with the dot still inside; congestion below makes it the bottleneck
    warmup: 12,            // s of simulated time run silently before it is shown (from an empty hospital)
    endAt: 600,            // s of simulated time at which it freezes, at the latest
    endQueue: 8,           // ...or as soon as this many arrivals wait in the entry queue
    congestAt: 3,          // squares in DISCHARGE at which a starting hold lasts congestHold instead of discharge (0: off)
    congestHold: 6,        // s, that congested hold
    metrias: 0,            // + Metrias (1 = on): a shorter discharge hold and more congestion tolerance, both illustrative
    metriasHold: 0.25,     // with + Metrias on, every discharge hold is multiplied by this (0.25 = a quarter as long)
    metriasTol: 3,         // with + Metrias on, the congested hold applies at this many times congestAt
    separateSlide: 0.2,    // s for the dot to slide out of the square in this mode
    seed: 11               // random seed for this mode. Runs near capacity vary a lot by seed: over seeds 1 to 10 at these defaults the freeze comes at a median ~53 s off and ~376 s with + Metrias; 11 is a hard day for + Metrias (off 60 s, on 83 s)
  },
  labelSize: 20,           // label font size, viewBox px
  colors: {
    bg: '#0a0f17',         // near-black navy background (page + reel)
    node: '#0e141e',       // node fill, a shade above the background
    line: '#273040',       // node outlines
    path: '#3a4557',       // dotted paths, exit slot
    label: '#76829a',      // labels and play affordance
    stretcher: '#566378',  // ED stretcher lines
    bed: '#c3ccd8',        // beds (U / full square), pale slate
    patient: '#74d6f4',    // patient dots, cyan glow
    metrias: '#b39dff',    // violet: the + Metrias toggle and the TIME SAVED tile
    wait: '#f2b866'        // amber: waiting. An INPATIENT slot whose bed is tied up, or a stretcher holding an admitted patient
  },
  labels: { pre: 'PRE-HOSPITAL', ed: 'ED', beds: 'BEDS', ip: 'INPATIENT', dc: 'DISCHARGE', evs: 'ENVIRONMENTAL SERVICES', pa: 'POST-ACUTE' } // exactly these seven
};
// ====================================================================================

const C = CONFIG.colors, NS = 'http://www.w3.org/2000/svg', STEP = 1 / CONFIG.stepHz, S = 44, HS = S / 2, PERIM = 4 * S;
document.documentElement.style.background = document.body.style.background = C.bg;
for (const k of ['line', 'label', 'patient', 'bed', 'wait', 'stretcher', 'metrias']) document.documentElement.style.setProperty('--' + k, C[k]);

// ---- layouts: PORTRAIT (viewBox 1080 x 1920, top to bottom) and LANDSCAPE (1920 x 1080, left to right) ----
// grids [cx, y0, px, py, cols]; rows [cx, cy, dx, dy]; at = entry points (slots fill nearest-first)
const PORTRAIT = { vb: [1080, 1920], flow: [0, 1],
  box: { pre: [340, 150, 400, 130, 'top'], ed: [340, 370, 400, 300], beds: [340, 790, 400, 260],
    evs: [64, 1000, 240, 270], ip: [770, 1000, 260, 260], dc: [340, 1200, 400, 250], pa: [340, 1580, 400, 150, 'bottom'] },
  paths: { in: 'M540 -30V370', home: 'M340 640H300L40 900V1440L130 1530H460L510 1580L540 1610', admit: 'M540 670V790',
    b2ip: 'M740 932H990V1000', ip2dc: 'M896 1270V1340H740', dc2evs: 'M340 1340H161V1270', evs2b: 'M276 1000V932H340', dc2pa: 'M540 1450V1960' },
  str: [540, 465, 72, 78, 3], exit: [540, 633], cell: [540, 870, 62, 62, 3], ips: [900, 1068, 62, 62, 3], evs: [161, 1176, 70, 0],
  at: { str: [540, 370], cell: [540, 790], ip: [990, 1046], dc: [740, 1340], evs: [161, 1270] },
  ipIn: [990, 1046], homeEnd: [540, 1960], evsOut: e => [276, e[1]], dcOut: (b, p) => [p.x, b.y + 74] };
const LANDSCAPE = { vb: [1920, 1080], flow: [1, 0],
  // Main row keeps the tall boxes; INPATIENT (above) and EVS (below) are wide and short, so the bed
  // cycle runs clockwise: BEDS -> up to INPATIENT -> down into DISCHARGE -> down to EVS -> up into BEDS.
  box: { pre: [110, 340, 200, 400, 'left'], ed: [370, 340, 300, 400], beds: [790, 340, 260, 400],
    ip: [1000, 40, 260, 260], evs: [880, 780, 500, 236], dc: [1200, 340, 250, 400], pa: [1580, 340, 200, 400, 'right'] },
  paths: { in: 'M-30 540H370', home: 'M640 340V300L900 20H1440L1530 110V460L1580 510L1610 540', admit: 'M670 540H790',
    b2ip: 'M1030 340V300', ip2dc: 'M1230 300V340', dc2evs: 'M1330 740V780', evs2b: 'M932 780V740', dc2pa: 'M1450 540H1960' },
  str: [504, 468, 78, 72, 2], exit: [633, 540], cell: [932, 478, 62, 62, 3], ips: [1130, 108, 62, 62, 3], evs: [1000, 900, 70, 0],
  at: { str: [370, 540], cell: [790, 540], ip: [1030, 300], dc: [1230, 340], evs: [1330, 780] },
  ipIn: [1030, 300], homeEnd: [1960, 540], evsOut: e => [e[0], 780], dcOut: (b, p) => [b.x + 74, p.y] };
const pickLayout = () => { const o = CONFIG.orientation; return o === 'landscape' || (o !== 'portrait' && innerWidth / innerHeight >= 1.2) ? LANDSCAPE : PORTRAIT; };
const grid = (n, [cx, y0, px, py, c]) => Array.from({ length: n }, (_, i) => [cx + (i % c - (c - 1) / 2) * px, y0 + Math.floor(i / c) * py]);
const row = (n, [cx, cy, dx, dy]) => Array.from({ length: n }, (_, i) => { const o = i - (n - 1) / 2; return [cx + o * dx, cy + o * dy]; });
const order = (pts, [x, y]) => pts.map((p, i) => [Math.hypot(p[0] - x, p[1] - y), i]).sort((a, b) => a[0] - b[0]).map(a => a[1]);
// n queue places `gap` apart, stepping straight back from a sampled path's end against its final segment
// (first one gap/2 out), past the path's start and off-frame if need be
function lineBack(pts, n, gap) {
  const e = pts[pts.length - 1], f = pts[pts.length - 2], l = Math.hypot(f[0] - e[0], f[1] - e[1]);
  return Array.from({ length: n }, (_, i) => [e[0] + (f[0] - e[0]) / l * gap * (i + .5), e[1] + (f[1] - e[1]) / l * gap * (i + .5)]);
}
const reel = document.getElementById('reel'), play = document.getElementById('play');
play.firstChild.setAttribute('fill', C.bg); play.firstChild.setAttribute('fill-opacity', '.85'); play.firstChild.setAttribute('stroke', C.label);
play.lastChild.setAttribute('fill', C.label);
let L, STR, EXIT, CELL, IPS, DCS, EVS, O_STR, O_CELL, O_IP, O_DC, O_EVS, IPEL, STREL, SLOOK, PTS, EQ;
const LS = CONFIG.labelSize, CW = LS * 0.6 + 1;

// ---- static drawing + sampled paths + position grids, from the chosen layout ----
function build(lay) {
  L = lay;
  STR = grid(CONFIG.stretchers, L.str);    // dot positions on stretchers (line 13 px below)
  EXIT = L.exit;                           // where admitted patients leave the ED (a waypoint, not drawn)
  CELL = grid(CONFIG.beds, L.cell);        // BEDS positions
  IPS = grid(CONFIG.beds, L.ips);          // INPATIENT slots
  const [dx, dy, dw, dh] = L.box.dc;
  DCS = grid(9, [dx + dw / 2, dy + dh / 2 - 62, 62, 62, 3]);   // DISCHARGE: 3 x 3 waiting grid centred in the box
  EVS = row(CONFIG.evsSlots, L.evs);
  O_STR = order(STR, L.at.str); O_CELL = order(CELL, L.at.cell); O_IP = order(IPS, L.at.ip); O_DC = order(DCS, L.at.dc); O_EVS = order(EVS, L.at.evs);
  const land = L === LANDSCAPE;
  reel.setAttribute('viewBox', '0 0 ' + L.vb.join(' ')); reel.classList.toggle('land', land);
  play.setAttribute('transform', land ? 'translate(420 -420)' : 'translate(0 0)');
  let h = `<defs><radialGradient id="gl"><stop offset="0" stop-color="${C.patient}" stop-opacity=".55"/><stop offset=".4" stop-color="${C.patient}" stop-opacity=".16"/><stop offset="1" stop-color="${C.patient}" stop-opacity="0"/></radialGradient></defs>`;
  for (const k in L.box) {
    const [x, y, w, bh, open] = L.box[k];
    const r = 10, yb = y + bh, xr = x + w; // open-ended source/sink boxes are drawn without their outer edge
    h += open === 'top' ? `<path d="M${x} ${y}V${yb - r}Q${x} ${yb} ${x + r} ${yb}H${xr - r}Q${xr} ${yb} ${xr} ${yb - r}V${y}"`
      : open === 'bottom' ? `<path d="M${x} ${yb}V${y + r}Q${x} ${y} ${x + r} ${y}H${xr - r}Q${xr} ${y} ${xr} ${y + r}V${yb}"`
