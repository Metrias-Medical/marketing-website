name = "metrias-lead"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Production route — bind the Worker to the apex /api/lead path.
# Requires the metriasmedical.com zone to be on this Cloudflare account.
# Uncomment and deploy with `wrangler deploy` once the zone + KV exist.
# [[routes]]
# pattern = "metriasmedical.com/api/lead*"
# zone_name = "metriasmedical.com"

# KV: rate-limiting, CSRF replay protection, MX cache, and Attio-outage replay queue.
# Create with: wrangler kv namespace create LEADS_KV  (and  --preview)
[[kv_namespaces]]
binding = "LEADS_KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

[vars]
POSTHOG_HOST = "https://us.i.posthog.com"
ALLOWED_ORIGIN = "https://www.metriasmedical.com"
RATE_LIMIT_PER_HOUR = "5"

# Replay any Attio-queued leads every 5 minutes (per Lead Capture → Attio Wiring spec).
[triggers]
crons = ["*/5 * * * *"]

# Secrets (NEVER commit) — set with `wrangler secret put <NAME>`:
#   ATTIO_API_TOKEN      op://Metrias/ATTIO_API_TOKEN/credential
#   POSTHOG_API_KEY      PostHog project API key (server-side capture)
#   CSRF_SECRET          any long random string (openssl rand -hex 32)
#   NOTIFY_WEBHOOK_URL   optional — POST target for new-lead notifications (iMessage/email bridge)
