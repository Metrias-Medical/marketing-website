name = "metrias-lead"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Path B — dedicated subdomain via Workers Custom Domain. Auto-creates the proxied (orange-cloud)
# DNS record + edge cert for lead.metriasmedical.com, leaving the GitHub Pages www/apex records
# untouched. The site form POSTs cross-origin to https://lead.metriasmedical.com/api/lead (CORS
# allow-origin = www, handled by the Worker).
[[routes]]
pattern = "lead.metriasmedical.com"
custom_domain = true

# KV: rate-limiting, CSRF replay protection, MX cache, and Attio-outage replay queue.
# Create with: wrangler kv namespace create LEADS_KV  (and  --preview)
[[kv_namespaces]]
binding = "LEADS_KV"
id = "4728b1c86d6645b199628ef08e19c3e6"
preview_id = "99229744a4944eb3b04942e704ec8f56"

[vars]
POSTHOG_HOST = "https://us.i.posthog.com"
ALLOWED_ORIGIN = "https://www.metriasmedical.com"
RATE_LIMIT_PER_HOUR = "5"

# NOTE: Attio-outage replay cron deferred — the schedules API rejected the trigger on this
# account/plan. The scheduled() handler stays in code; on outage, leads queue to KV and can be
# replayed manually (`wrangler dev` + curl /cdn-cgi/handler/scheduled) or re-enable crons later.
# [triggers]
# crons = ["*/5 * * * *"]

# Secrets (NEVER commit) — set with `wrangler secret put <NAME>`:
#   ATTIO_API_TOKEN      op://Metrias/ATTIO_API_TOKEN/credential
#   POSTHOG_API_KEY      PostHog project API key (server-side capture)
#   CSRF_SECRET          any long random string (openssl rand -hex 32)
#   NOTIFY_WEBHOOK_URL   optional — POST target for new-lead notifications (iMessage/email bridge)
#   LINKEDIN_CAPI_ACCESS_TOKEN   optional — OAuth token (rw_conversions scope) for the LinkedIn
#                                Conversions API; server-side TLA attribution. No-op if unset.
#   LINKEDIN_CONVERSION_RULE_ID  optional — numeric id of the Campaign Manager conversion rule.
#   LINKEDIN_API_VERSION         optional — LinkedIn-Version header (YYYYMM), defaults to 202601.
